<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" role="img" aria-label="Tienes una idea. Hagamos que trabaje.">
<style>.bg{fill:#0b0b0e}.frame{fill:none;stroke:#2b2c32}.main{fill:#f6f5f2;font:700 30px 'Segoe UI',Arial,sans-serif}.red{fill:#b63245}.sub{fill:#9999a1;font:400 15px 'Segoe UI',Arial,sans-serif}.beam{fill:#b63245}</style>
<rect class="bg" width="800" height="170" rx="20"/><rect class="frame" x="1" y="1" width="798" height="168" rx="19"/>
<text class="main" x="400" y="71" text-anchor="middle">¿TIENES UNA IDEA? <tspan class="red">HAGAMOS QUE TRABAJE.</tspan><animate attributeName="opacity" values=".45;1;1;.45" keyTimes="0;.25;.75;1" dur="4s" repeatCount="indefinite"/></text>
<text class="sub" x="400" y="105" text-anchor="middle">Inteligente · útil · preparada para crecer</text>
<rect class="beam" x="300" y="128" width="200" height="3" rx="2"><animate attributeName="x" values="300;365;300" dur="3s" repeatCount="indefinite"/><animate attributeName="width" values="200;70;200" dur="3s" repeatCount="indefinite"/></rect>
</svg>