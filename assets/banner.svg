<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:center}.orbit{animation:orbit 10s linear infinite;transform-origin:1080px 174px}.scan{animation:scan 5s ease-in-out infinite}.dash{stroke-dasharray:9 13;animation:dash 8s linear infinite}.eyebrow{animation:fade 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.86)}50%{opacity:1;transform:scale(1.18)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateY(-55px);opacity:0}20%,80%{opacity:.5}50%{transform:translateY(390px)}}@keyframes dash{to{stroke-dashoffset:-220}}@keyframes fade{0%,100%{opacity:.62}50%{opacity:1}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400"><stop stop-color="#08080A"/><stop offset=".54" stop-color="#111014"/><stop offset="1" stop-color="#290C13"/></linearGradient>
<radialGradient id="g" cx="0" cy="0" r="1" gradientTransform="translate(1050 150) rotate(135) scale(550 410)"><stop stop-color="#B63245" stop-opacity=".42"/><stop offset="1" stop-color="#B63245" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#F6F5F2" stroke-opacity=".035"/></pattern>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B63245" stop-opacity="0"/><stop offset=".5" stop-color="#B63245"/><stop offset="1" stop-color="#B63245" stop-opacity="0"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="1280" height="400" rx="26" fill="url(#bg)"/><rect width="1280" height="400" rx="26" fill="url(#g)"/><rect width="1280" height="400" rx="26" fill="url(#grid)"/>
<rect class="scan" x="0" y="0" width="1280" height="2" fill="url(#scanG)" opacity=".35"/>
<circle cx="1080" cy="174" r="132" fill="#B63245" fill-opacity=".07" filter="url(#blur)"/><circle class="dash" cx="1080" cy="174" r="105" stroke="#B63245" stroke-opacity=".48" stroke-width="2"/>
<g class="orbit"><circle cx="1080" cy="69" r="6" fill="#F6F5F2"/><circle cx="1185" cy="174" r="4" fill="#B63245"/></g>
<path d="M1080 101L1143 137V210L1080 246L1017 210V137L1080 101Z" stroke="#F6F5F2" stroke-opacity=".28" stroke-width="2"/><path d="M1045 153L1080 132L1115 153V194L1080 215L1045 194V153Z" stroke="#B63245" stroke-width="3"/>
<circle class="pulse" cx="1080" cy="174" r="15" fill="#B63245"/><circle class="pulse" cx="1017" cy="137" r="5" fill="#F6F5F2" style="animation-delay:.7s"/><circle class="pulse" cx="1143" cy="210" r="5" fill="#F6F5F2" style="animation-delay:1.4s"/><path d="M1017 137L1080 174L1143 210" stroke="#F6F5F2" stroke-opacity=".35"/>
<text class="eyebrow" x="84" y="82" fill="#D7475B" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="5">AI SOLUTIONS · PREMIUM WEB · AUTOMATION</text>
<text x="80" y="171" fill="#F6F5F2" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="800" letter-spacing="-3">ENRIQUE MARIN</text>
<text x="84" y="220" fill="#D1CDC7" font-family="Arial,Helvetica,sans-serif" font-size="25">I turn complex processes into intelligent digital systems.</text>
<rect x="84" y="264" width="164" height="38" rx="19" fill="#B63245"/><circle class="pulse" cx="105" cy="283" r="5" fill="#F6F5F2"/><text x="121" y="289" fill="#F6F5F2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">BUILDING NOW</text>
<text x="84" y="349" fill="#8F8A84" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" letter-spacing="3">LIMA, PERU  /  ENGINEERING WITH PURPOSE</text>
</svg>