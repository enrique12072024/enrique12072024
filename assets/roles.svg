<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="74" viewBox="0 0 1000 74" role="img" aria-label="IA, web premium y automatización">
  <style>
    .bg{fill:#0d0d0f;stroke:#b63245;stroke-width:1}
    .txt{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#f6f5f2;letter-spacing:2px;text-anchor:middle}
    .accent{fill:#b63245}
    .line{stroke:#b63245;stroke-width:2}
    @media (prefers-reduced-motion:reduce){animate{display:none}}
  </style>
  <rect class="bg" x="1" y="1" width="998" height="72" rx="16"/>
  <line class="line" x1="35" y1="37" x2="115" y2="37"/>
  <circle class="accent" cx="130" cy="37" r="5"/>
  <line class="line" x1="885" y1="37" x2="965" y2="37"/>
  <circle class="accent" cx="870" cy="37" r="5"/>
  <g>
    <text class="txt" x="500" y="46">IA QUE IMPULSA NEGOCIOS
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.25;0.32;0.92;0.94;0.98;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text class="txt" x="500" y="46" opacity="0">WEB PREMIUM QUE CONVIERTE
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.58;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text class="txt" x="500" y="46" opacity="0">AUTOMATIZACIÓN QUE AHORRA TIEMPO
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>